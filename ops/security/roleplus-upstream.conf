# Incluir dentro de los VirtualHost de RolePlus, no como ajuste global.
# Gemini tiene 60 s de espera en PHP; Apache debe permitir devolver su resultado.
# Timeout y RequestReadTimeout anti-DoS siguen protegiendo las conexiones del cliente.
<IfModule mod_proxy.c>
    ProxyTimeout 75
</IfModule>

# Sello de entrada generado por Apache, sustituyendo cualquier valor del cliente.
<IfModule mod_headers.c>
    RequestHeader unset X-RolePlus-Request-Start
    RequestHeader set X-RolePlus-Request-Start "%t"
</IfModule>
