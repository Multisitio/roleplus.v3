# Incluir dentro del VirtualHost gestionado, antes de sus otras reglas.
# El estado caduca por reloj monotono: no requiere recargar Apache por copia.
RewriteEngine On
RewriteMap vigilante_window "prg:/usr/local/lib/vigilante/vigilante-maintenance.py --map /run/vigilante-maintenance/state.json" www-data:www-data
RewriteCond %{REQUEST_URI} !^/__vigilante_(maintenance|assets)(/|$)
RewriteCond ${vigilante_window:%{HTTP_HOST}|off} =on
RewriteRule ^ - [E=VIGILANTE_MAINTENANCE:on]
RewriteCond %{ENV:VIGILANTE_MAINTENANCE} =on
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{REQUEST_URI} \.(css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|pdf)$ [NC]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
RewriteRule ^ - [E=VIGILANTE_STATIC:1]
RewriteCond %{ENV:VIGILANTE_MAINTENANCE} =on
RewriteCond %{ENV:VIGILANTE_STATIC} !=1
RewriteCond %{REQUEST_URI} !^/__vigilante_(maintenance|assets)(/|$)
RewriteRule ^ /__vigilante_maintenance [PT,L]

ScriptAlias /__vigilante_maintenance /usr/lib/vigilante-maintenance/maintenance.cgi
Alias /__vigilante_assets/ /usr/share/vigilante-maintenance/
<Directory /usr/lib/vigilante-maintenance>
    Options +ExecCGI -Indexes
    AllowOverride None
    Require all granted
</Directory>
<Directory /usr/share/vigilante-maintenance>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
